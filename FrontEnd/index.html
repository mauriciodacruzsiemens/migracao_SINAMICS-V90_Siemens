<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferramenta de Migração SINAMICS </title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #001A72 0%,
                #004E9A 50%,
                #009999 100%
            );

            font-family: Arial, sans-serif;
            color: white;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 40px;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            opacity: 0.95;
        }

        .icon {
            font-size: 4rem;
            margin-bottom: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚧</div>
        <h1>Ferramenta em Manutenção</h1>
        <p>
            Estamos realizando melhorias para oferecer uma experiência ainda mais segura.
        </p>
        <p>
            Em breve estaremos de volta.
    </div>
</body>
</html>
